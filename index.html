<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulari Premium</title>
    <link rel="stylesheet" href="estils.css">
</head>
<body id="pagina-formulari">

<nav class="navbar">
    <div class="logo">EX006</div>
    <div class="nav-links">
        <a href="index.html">Formulari</a>
        <a href="interaccio.html">Interacció</a>
    </div>
</nav>

<main class="container fade-in">

    <form class="glass">

        <h1>Registre Premium</h1>

        <div class="field">
            <input type="text" required
                   pattern="^[A-Za-zÀ-ÿ\s]{3,40}$"
                   title="Entre 3 i 40 lletres">
            <label>Nom complet</label>
        </div>

        <div class="field">
            <input type="email" required>
            <label>Correu electrònic</label>
        </div>

        <div class="field">
            <input type="tel"
                   pattern="^[0-9]{9}$"
                   title="9 dígits sense espais">
            <label>Telèfon</label>
        </div>

        <div class="field">
            <input type="number" min="18" max="99">
            <label>Edat</label>
        </div>

        <div class="field">
            <input type="date">
            <label class="active">Data de naixement</label>
        </div>

        <div class="field">
            <input type="color">
            <label class="active">Color preferit</label>
        </div>

        <div class="range-container">
            <label>Satisfacció</label>
            <input type="range" min="0" max="10">
        </div>

        <div class="options">
            <p>Aficions</p>
            <label class="check">
                <input type="checkbox">
                <span></span> Música
            </label>
            <label class="check">
                <input type="checkbox">
                <span></span> Esport
            </label>
        </div>

        <div class="options">
            <p>Nivell d'estudis</p>
            <label class="radio">
                <input type="radio" name="estudis">
                <span></span> ESO
            </label>
            <label class="radio">
                <input type="radio" name="estudis">
                <span></span> Universitat
            </label>
        </div>

        <button type="submit" class="btn">Enviar</button>

    </form>

</main>

</body>
</html>
